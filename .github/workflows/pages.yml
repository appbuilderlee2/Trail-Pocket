name: Deploy Trail Pocket to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare stable v3.8 PWA
        run: |
          mkdir -p dist/assets dist/vendor
          cp backup.mjs wake-lock.mjs offline-download.mjs offline-search.mjs routing-core.mjs routing-client.mjs route-worker.mjs offline-package.mjs activity.mjs activity-core.mjs activity.css geopdf.mjs geopdf-core.mjs geopdf-parser.mjs geopdf-render.mjs geopdf.css map-source.css index.html style.css adventure.css app.mjs core.mjs storage.mjs map.mjs adventure.mjs adventure-core.mjs explore.mjs explore-core.mjs online-map.mjs terrain.mjs explore.css sw.js manifest.webmanifest dist/
          cp vendor/pdf-lib.min.mjs vendor/pdf.min.mjs vendor/pdf.worker.min.mjs vendor/pdf-lib-LICENSE.md vendor/pdfjs-LICENSE dist/vendor/
          cp assets/icon-192.png assets/icon-512.png assets/devils-route.json assets/devils-base.json dist/assets/
          touch dist/.nojekyll

      - name: Prepare isolated v4 beta preview
        run: |
          git fetch --depth=1 origin development/v4.0
          mkdir preview-src
          git archive FETCH_HEAD | tar -x -C preview-src
          cd preview-src
          npm ci --omit=dev
          mkdir -p dist/assets dist/vendor
          cp backup.mjs wake-lock.mjs offline-download.mjs offline-search.mjs package-search.mjs package-routing.mjs routing-core.mjs routing-client.mjs route-worker.mjs offline-package.mjs package-storage.mjs package-manifest.mjs package-downloader.mjs package-manager.mjs package-manager.css package-manager-controls.css sha256.mjs vector-map.mjs vector-map.css outdoor-style.mjs pmtiles-opfs.mjs activity.mjs activity-core.mjs activity.css geopdf.mjs geopdf-core.mjs geopdf-parser.mjs geopdf-render.mjs geopdf.css map-source.css index.html style.css adventure.css app.mjs core.mjs storage.mjs map.mjs adventure.mjs adventure-core.mjs explore.mjs explore-core.mjs online-map.mjs terrain.mjs explore.css sw.js manifest.webmanifest hiking-ui.css unified-ui.css unified-ui.mjs reliability-core.mjs markers.mjs dist/
          cp vendor/pdf-lib.min.mjs vendor/pdf.min.mjs vendor/pdf.worker.min.mjs vendor/pdf-lib-LICENSE.md vendor/pdfjs-LICENSE dist/vendor/
          cp node_modules/maplibre-gl/dist/maplibre-gl.mjs node_modules/maplibre-gl/dist/maplibre-gl-shared.mjs node_modules/maplibre-gl/dist/maplibre-gl-worker.mjs node_modules/maplibre-gl/dist/maplibre-gl.css dist/vendor/
          cp node_modules/maplibre-gl/LICENSE.txt dist/vendor/maplibre-LICENSE.txt
          cp node_modules/pmtiles/dist/pmtiles.js dist/vendor/pmtiles.js
          cp assets/icon-192.png assets/icon-512.png assets/devils-route.json assets/devils-base.json dist/assets/
          touch dist/.nojekyll
          cd ..
          mv preview-src/dist dist/v4-preview

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
