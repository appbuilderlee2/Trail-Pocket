<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#193f32" />
  <title>Trail Pocket v4.1.4 修復</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#153f32;background:#f7f8f3}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(520px,100%);background:#fff;border:1px solid #dfe5dc;border-radius:24px;padding:24px;box-sizing:border-box;box-shadow:0 18px 50px rgba(20,53,39,.08)}
    h1{margin:0 0 8px;font-size:28px}p{line-height:1.55;color:#52685f}.status{padding:14px;border-radius:14px;background:#eef4e8;margin:16px 0;white-space:pre-line}.actions{display:flex;gap:10px;flex-wrap:wrap}button,a{appearance:none;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;text-decoration:none}.primary{background:#184c3b;color:#fff}.secondary{background:#edf2ea;color:#184c3b}
  </style>
</head>
<body>
<main>
  <h1>Trail Pocket v4.1.4 修復</h1>
  <p>呢個修復只會移除舊 App 外殼、Service Worker 同 shell cache。<b>唔會刪除 IndexedDB、OPFS、GPX／KML、活動、標記或離線地圖資料。</b></p>
  <div id="status" class="status">準備修復…</div>
  <div class="actions"><button id="start" class="primary">開始修復</button><a class="secondary" href="./">返回 Trail Pocket</a></div>
</main>
<script>
(() => {
  const VERSION='4.1.4';
  const status=document.getElementById('status');
  const start=document.getElementById('start');
  const say=t=>status.textContent=t;
  async function recover(){
    start.disabled=true;
    try{
      say('1/4 正在解除舊 Service Worker…');
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        for(const reg of regs){
          if(reg.scope.startsWith(new URL('./',location.href).href)) await reg.unregister();
        }
      }
      say('2/4 正在清理舊 App shell cache…');
      if('caches' in window){
        const prefix='trail-pocket-shell:'+new URL('./',location.href).pathname+':';
        for(const key of await caches.keys()) if(key.startsWith(prefix)) await caches.delete(key);
      }
      say('3/4 正在確認 v'+VERSION+' 核心檔案…');
      const probe=await fetch('./app.mjs?v='+VERSION+'&t='+Date.now(),{cache:'reload'});
      if(!probe.ok) throw new Error('新版 app.mjs 未能下載（HTTP '+probe.status+'）');
      const sw=await fetch('./sw.js?v='+VERSION+'&t='+Date.now(),{cache:'reload'});
      if(!sw.ok) throw new Error('新版 sw.js 未能下載（HTTP '+sw.status+'）');
      say('4/4 修復完成，正在重新開啟 Trail Pocket…');
      setTimeout(()=>location.replace('./?recover='+VERSION+'&t='+Date.now()),500);
    }catch(error){
      say('修復未完成：'+(error?.message||'未知錯誤')+'\n\n請保持網絡連線後再試。');
      start.disabled=false;
    }
  }
  start.addEventListener('click',recover);
  recover();
})();
</script>
</body>
</html>
