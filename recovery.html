<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#193f32" />
  <title>Trail Pocket Recovery</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#153f32;background:#f7f8f3}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(520px,100%);background:#fff;border:1px solid #dfe5dc;border-radius:24px;padding:24px;box-sizing:border-box;box-shadow:0 18px 50px rgba(20,53,39,.08)}
    h1{margin:0 0 8px;font-size:28px}p{line-height:1.55;color:#52685f}.status{padding:14px;border-radius:14px;background:#eef4e8;margin:16px 0;line-height:1.45}.actions{display:flex;gap:10px;flex-wrap:wrap}button,a{appearance:none;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;text-decoration:none}.primary{background:#184c3b;color:#fff}.secondary{background:#edf2ea;color:#184c3b}
  </style>
</head>
<body>
<main>
  <h1>Trail Pocket 修復</h1>
  <p>會強制重建 Trail Pocket App 外殼及 Service Worker。<b>不會清除 IndexedDB、OPFS、離線地圖、GPX／KML、活動或標記。</b></p>
  <div id="status" class="status">準備修復至 v4.1.4…</div>
  <div class="actions"><button id="retry" class="primary">重新修復</button><a class="secondary" href="./?recover=4.1.4">返回 Trail Pocket</a></div>
</main>
<script>
(() => {
  const VERSION='4.1.4';
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');
  let redirected=false;
  const say=text=>status.textContent=text;
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const go=()=>{
    if(redirected)return;
    redirected=true;
    say('修復完成，正在重新開啟 Trail Pocket v'+VERSION+'…');
    setTimeout(()=>location.replace('./?recover='+encodeURIComponent(VERSION)+'&t='+Date.now()),700);
  };
  async function waitForState(worker,target,timeout=25000){
    if(!worker)return false;
    if(worker.state===target)return true;
    return new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>reject(new Error('等待 '+target+' 逾時')),timeout);
      const onState=()=>{
        if(worker.state===target){clearTimeout(timer);worker.removeEventListener('statechange',onState);resolve(true);}
        if(worker.state==='redundant'){clearTimeout(timer);worker.removeEventListener('statechange',onState);reject(new Error('新版 Service Worker 安裝失敗'));}
      };
      worker.addEventListener('statechange',onState);
    });
  }
  async function recover(){
    retry.disabled=true;
    try{
      if(!('serviceWorker' in navigator))throw new Error('此瀏覽器不支援 Service Worker');
      say('1/4 正在解除舊版 Service Worker…');
      const scopePath=new URL('./',location.href).pathname;
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){
        try{
          const path=new URL(reg.scope).pathname;
          if(path===scopePath || path.startsWith(scopePath) || scopePath.startsWith(path))await reg.unregister();
        }catch{}
      }
      say('2/4 正在清除舊 App 外殼快取…');
      if('caches' in window){
        for(const key of await caches.keys()){
          if(key.startsWith('trail-pocket-shell:'))await caches.delete(key);
        }
      }
      await sleep(350);
      say('3/4 正在重新安裝 v'+VERSION+'…');
      const sw='./sw.js?v='+encodeURIComponent(VERSION)+'&t='+Date.now();
      const reg=await navigator.serviceWorker.register(sw,{scope:'./',updateViaCache:'none'});
      let worker=reg.installing || reg.waiting || reg.active;
      if(reg.installing){
        await waitForState(reg.installing,'installed');
        worker=reg.waiting || reg.installing;
      }
      if(reg.waiting){
        say('4/4 新版已下載，正在啟用…');
        reg.waiting.postMessage({type:'UPDATE'});
      }
      const deadline=Date.now()+25000;
      while(Date.now()<deadline){
        const fresh=await navigator.serviceWorker.getRegistration('./');
        if(fresh?.active?.scriptURL?.includes('v='+encodeURIComponent(VERSION)) || fresh?.active){
          try{
            const ch=new MessageChannel();
            const ready=await new Promise(resolve=>{
              const timer=setTimeout(()=>resolve(false),4000);
              ch.port1.onmessage=e=>{clearTimeout(timer);resolve(String(e.data?.version||'').includes(VERSION));};
              fresh.active.postMessage({type:'STATUS'},[ch.port2]);
            });
            if(ready){go();return;}
          }catch{}
        }
        await sleep(500);
      }
      throw new Error('新版 App 外殼未能在限時內啟用');
    }catch(error){
      say('修復未完成：'+(error?.message||'請稍後再試'));
      retry.disabled=false;
    }
  }
  retry.addEventListener('click',recover);
  recover();
})();
</script>
</body>
</html>
