<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#193f32" />
  <title>Trail Pocket Recovery</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#153f32;background:#f7f8f3}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(520px,100%);background:#fff;border:1px solid #dfe5dc;border-radius:24px;padding:24px;box-shadow:0 18px 50px rgba(20,53,39,.08)}
    h1{margin:0 0 8px;font-size:28px}p{line-height:1.55;color:#52685f}strong{display:block;margin:18px 0 8px;font-size:18px}.status{padding:14px;border-radius:14px;background:#eef4e8;margin:16px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}button,a{appearance:none;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;text-decoration:none}.primary{background:#184c3b;color:#fff}.secondary{background:#edf2ea;color:#184c3b}
  </style>
</head>
<body>
<main>
  <h1>Trail Pocket 修復</h1>
  <p>只會重新安裝 App 外殼及 Service Worker。<b>不會清除 IndexedDB、OPFS、離線地圖、GPX／KML、活動或標記。</b></p>
  <div id="status" class="status">準備更新至 v4.1.3…</div>
  <div class="actions"><button id="retry" class="primary">重新嘗試</button><a class="secondary" href="./">返回 Trail Pocket</a></div>
</main>
<script>
(() => {
  const VERSION='4.1.3';
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');
  let redirected=false;
  const say=text=>status.textContent=text;
  const go=()=>{if(redirected)return;redirected=true;say('修復完成，正在重新開啟 Trail Pocket…');setTimeout(()=>location.replace('./?recovered='+encodeURIComponent(VERSION)),450);};
  const activate=reg=>{
    if(reg.waiting){
      say('新版已下載，正在啟用…');
      navigator.serviceWorker.addEventListener('controllerchange',go,{once:true});
      reg.waiting.postMessage({type:'UPDATE'});
      setTimeout(go,5000);
      return true;
    }
    return false;
  };
  async function recover(){
    retry.disabled=true;
    try{
      if(!('serviceWorker' in navigator))throw new Error('此瀏覽器不支援 Service Worker');
      say('正在下載 v'+VERSION+' 修復版本…');
      const sw='./sw.js?v='+encodeURIComponent(VERSION);
      const reg=await navigator.serviceWorker.register(sw,{scope:'./',updateViaCache:'none'});
      try{await reg.update();}catch{}
      if(activate(reg))return;
      const worker=reg.installing;
      if(worker){
        await new Promise((resolve,reject)=>{
          const timer=setTimeout(()=>reject(new Error('新版安裝逾時')),20000);
          worker.addEventListener('statechange',()=>{
            if(worker.state==='installed'){clearTimeout(timer);resolve();}
            if(worker.state==='redundant'){clearTimeout(timer);reject(new Error('新版安裝失敗'));}
          });
        });
        if(activate(reg))return;
      }
      if(reg.active){
        say('Service Worker 已就緒，正在重新開啟…');
        go();
        return;
      }
      throw new Error('未能啟用新版 Service Worker');
    }catch(error){
      say('修復未完成：'+(error?.message||'請稍後再試'));
      retry.disabled=false;
    }
  }
  retry.addEventListener('click',recover);
  recover();
})();
</script>
</body>
</html>
